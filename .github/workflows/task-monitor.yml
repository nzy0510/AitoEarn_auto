name: AitoEarn Task Monitor

on:
  # Automatic schedule is paused. Use workflow_dispatch to run manually.
  workflow_dispatch:          # manual trigger for testing

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Scan & accept tasks
        env:
          AITOEARN_API_KEY:  ${{ secrets.AITOEARN_API_KEY }}
          QQ_EMAIL:          ${{ secrets.QQ_EMAIL }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
        run: python scripts/monitor.py
