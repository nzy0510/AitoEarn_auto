name: AitoEarn Task Monitor

on:
  schedule:
    - cron: "*/10 0 * * *"       # 0:00-0:50 every 10min
    - cron: "40,50 6 * * *"     # 6:40, 6:50
    - cron: "*/10 7-23 * * *"   # 7:00-23:50 every 10min
    # skip 1:00-6:30 UTC
  workflow_dispatch:          # manual trigger for testing

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Scan & accept tasks
        env:
          AITOEARN_API_KEY:  ${{ secrets.AITOEARN_API_KEY }}
          QQ_EMAIL:          ${{ secrets.QQ_EMAIL }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
        run: python scripts/monitor.py
