name: AitoEarn Task Monitor

on:
  schedule:
    - cron: "0,30 0-16 * * *"    # UTC 0:00-16:30 (北京 8:00-0:30)
    - cron: "0,30 23 * * *"      # UTC 23:00,23:30 (北京 7:00,7:30)
    # skip UTC 17:00-22:59 = 北京凌晨 1:00-6:59
  workflow_dispatch:          # manual trigger for testing

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Scan & accept tasks
        env:
          AITOEARN_API_KEY:  ${{ secrets.AITOEARN_API_KEY }}
          QQ_EMAIL:          ${{ secrets.QQ_EMAIL }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
        run: python scripts/monitor.py
